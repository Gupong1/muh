name: Auto Fix & Build APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: 🔧 AUTO FIX SEMUA MASALAH
        run: |
          echo "========================================="
          echo "🔧 AUTO FIX UNTUK SDK ^3.8.1"
          echo "========================================="
          
          # 1. FIX pubspec.yaml
          echo "📝 Fixing pubspec.yaml..."
          if grep -q "sdk: ^3.8.1" pubspec.yaml; then
            echo "✅ SDK sudah benar"
          else
            sed -i 's/sdk: .*/sdk: ^3.8.1/g' pubspec.yaml
            echo "✅ SDK diubah ke ^3.8.1"
          fi
          
          # 2. FIX android/build.gradle
          echo "📝 Fixing android/build.gradle..."
          if [ -f "android/build.gradle" ]; then
            # Fix gradle version
            sed -i 's/classpath "com.android.tools.build:gradle:.*"/classpath "com.android.tools.build:gradle:8.8.0"/g' android/build.gradle
            sed -i 's/classpath("com.android.tools.build:gradle:.*")/classpath("com.android.tools.build:gradle:8.8.0")/g' android/build.gradle
            
            # Fix kotlin version
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/g' android/build.gradle
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/g' android/build.gradle.kts
            echo "✅ android/build.gradle diupdate"
          fi
          
          # 3. FIX android/app/build.gradle
          echo "📝 Fixing android/app/build.gradle..."
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk [0-9]*/compileSdk 35/g' android/app/build.gradle
            sed -i 's/targetSdk [0-9]*/targetSdk 35/g' android/app/build.gradle
            sed -i 's/minSdk [0-9]*/minSdk 21/g' android/app/build.gradle
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 35/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle
            echo "✅ android/app/build.gradle diupdate"
          fi
          
          # 4. FIX android/app/build.gradle.kts
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = [0-9]*/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9]*/minSdk = 21/g' android/app/build.gradle.kts
            echo "✅ android/app/build.gradle.kts diupdate"
          fi
          
          # 5. FIX gradle-wrapper.properties
          echo "📝 Fixing gradle-wrapper.properties..."
          sed -i 's/gradle-.*-all\.zip/gradle-8.14.0-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          echo "✅ gradle-wrapper.properties diupdate ke 8.14.0"
          
          # 6. FIX permissions
          echo "📝 Fixing permissions..."
          chmod +x android/gradlew
          echo "✅ Permissions fixed"
          
          # 7. FIX AndroidManifest.xml (tambahan)
          echo "📝 Fixing AndroidManifest.xml..."
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            # Hapus uses-sdk yang mungkin conflict
            sed -i '/<uses-sdk/d' android/app/src/main/AndroidManifest.xml
            echo "✅ AndroidManifest.xml diupdate"
          fi
          
          echo "========================================="
          echo "✅ SEMUA FIX SELESAI!"
          echo "========================================="

      - name: Get Packages
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xerion-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
