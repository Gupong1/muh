name: Auto Build Flutter App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil Kode Repositori
        uses: actions/checkout@v4

      - name: Setup Java JDK (Kebutuhan Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK (Otomatis Deteksi Versi)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '' # Kosongkan agar otomatis mengikuti versi terbaru/pubspec
          cache: true

      - name: Install Android SDK & NDK Otomatis
        uses: android-actions/setup-android@v3

      - name: Ambil Dependensi (Pub Get)
        run: flutter pub get

      - name: Jalankan Build APK Release
        run: flutter build apk --release

      - name: Unggah Hasil Build APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
