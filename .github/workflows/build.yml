name: Build APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Read Flutter SDK version from pubspec.yaml
        id: read_flutter_version
        run: |
          # Baca environment sdk dari pubspec.yaml
          SDK_LINE=$(grep -E "^environment:" -A 2 pubspec.yaml | grep "sdk:" | sed 's/.*sdk: "\(.*\)"/\1/' || echo "")
          
          # Ekstrak versi minimal
          if [[ -n "$SDK_LINE" ]]; then
            # Ambil angka versi minimal (contoh: ">=3.8.0 <4.0.0" -> "3.8.0")
            MIN_VERSION=$(echo "$SDK_LINE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            echo "min_version=$MIN_VERSION" >> $GITHUB_OUTPUT
            echo "full_sdk=$SDK_LINE" >> $GITHUB_OUTPUT
            echo "✅ Found SDK requirement: $SDK_LINE"
            echo "📌 Minimum version: $MIN_VERSION"
          else
            echo "min_version=3.0.0" >> $GITHUB_OUTPUT
            echo "full_sdk=>=3.0.0" >> $GITHUB_OUTPUT
            echo "⚠️ No SDK version found, using default 3.0.0"
          fi

      - name: Determine Flutter version
        id: flutter_version
        run: |
          MIN_VER="${{ steps.read_flutter_version.outputs.min_version }}"
          
          # Mapping versi Flutter berdasarkan kebutuhan SDK
          # Flutter 3.22.x = Dart 3.4.x
          # Flutter 3.19.x = Dart 3.3.x
          # Flutter 3.16.x = Dart 3.2.x
          # Flutter 3.13.x = Dart 3.1.x
          # Flutter 3.10.x = Dart 3.0.x
          
          case "$MIN_VER" in
            3.8.*|3.9.*|3.10.*|3.11.*|3.12.*|3.13.*|3.14.*|3.15.*|3.16.*|3.17.*|3.18.*|3.19.*|3.20.*|3.21.*|3.22.*|3.23.*|3.24.*|3.25.*|3.26.*|3.27.*|3.28.*|3.29.*|3.30.*|3.31.*|3.32.*|3.33.*|3.34.*|3.35.*|3.36.*|3.37.*|3.38.*|3.39.*|3.40.*|3.41.*|3.42.*|3.43.*|3.44.*|3.45.*|3.46.*|3.47.*)
              FLUTTER_VER="3.22.6"
              ;;
            3.4.*|3.5.*|3.6.*|3.7.*)
              FLUTTER_VER="3.22.6"
              ;;
            3.0.*|3.1.*|3.2.*|3.3.*)
              FLUTTER_VER="3.19.6"
              ;;
            2.*)
              FLUTTER_VER="3.16.9"
              ;;
            *)
              FLUTTER_VER="3.22.6"
              ;;
          esac
          
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "✅ Using Flutter version: $FLUTTER_VER (for SDK $MIN_VER)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.flutter_version.outputs.flutter_version }}

      - name: Enable flutter doctor verbose
        run: flutter doctor -v

      - name: Clean and get packages
        run: |
          flutter clean
          flutter pub get

      - name: Fix Gradle wrapper permissions
        run: chmod +x gradlew
        working-directory: android

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyper-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
